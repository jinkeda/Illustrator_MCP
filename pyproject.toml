[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illustrator-mcp"
dynamic = ["version"]
description = "MCP server for controlling Adobe Illustrator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Keda Jin"}
]
keywords = ["mcp", "adobe", "illustrator", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.1.0,<2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
geometry = [
    "pyclipper>=1.3.0",
]

[project.scripts]
illustrator-mcp = "illustrator_mcp.server:main"

[tool.setuptools.packages.find]
include = ["illustrator_mcp", "illustrator_mcp.*"]
[tool.setuptools.package-data]
"illustrator_mcp" = [
    "resources/scripts/*.jsx",
    "resources/scripts/manifest.json",
    "resources/templates/*.jsx",
    "resources/docs/*.md",
    "resources/docs/*.json",
    "schemas/*.json",
]

[tool.setuptools.dynamic]
version = {attr = "illustrator_mcp.__version__.__version__"}

