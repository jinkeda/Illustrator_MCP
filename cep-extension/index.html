<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Illustrator MCP</title>
  <script src="./CSInterface.js"></script>
</head>

<body>
  <div id="debug-error-overlay"
    style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; color:red; z-index:9999; display:none; padding:20px; box-sizing:border-box; overflow:auto; font-family:monospace; white-space:pre-wrap;">
  </div>
  <script>
    window.onerror = function (msg, url, line, col, error) {
      var overlay = document.getElementById('debug-error-overlay');
      if (overlay) {
        overlay.style.display = 'block';
        overlay.innerText += 'Error: ' + msg + '\n' + (error ? error.stack : '') + '\n\n';
      }
    };
    window.onunhandledrejection = function (e) {
      var overlay = document.getElementById('debug-error-overlay');
      if (overlay) {
        overlay.style.display = 'block';
        overlay.innerText += 'Unhandled Rejection: ' + (e.reason ? (e.reason.stack || e.reason) : e.reason) + '\n\n';
      }
    };
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
